[project]
name = "knowledge"
version = "0.1.0"
description = "Firefox → Anytype bookmark import pipeline"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
categorize = "categorize:main"
import-bookmarks = "import:main"
fetch-markdown = "fetch_markdown:main"
enrich-bookmarks = "enrich:main"
synthesize-guides = "synthesize:main"
knowledge-pipeline = "pipeline:main"
